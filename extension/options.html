<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inkling extension options</title>
    <style>
      body {
        max-width: 520px;
        margin: 40px auto;
        padding: 0 20px;
        color: #292824;
        font:
          14px/1.55 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        color: #625f57;
      }
      button {
        padding: 8px 16px;
        border: 0;
        border-radius: 7px;
        background: #292824;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      button[hidden] {
        display: none;
      }
      #status {
        min-height: 22px;
        color: #292824;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Connect inkling</h1>
    <p>
      Connected, a save goes straight into your library and the popup tells you it is there. Not
      connected, a save opens the inkling app instead. Everything stays on this computer.
    </p>
    <p id="status" role="status"></p>
    <button id="connect" type="button" hidden>Connect</button>
    <button id="disconnect" type="button" hidden>Disconnect</button>
    <script type="module" src="./src/options.ts"></script>
  </body>
</html>
