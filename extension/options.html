<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; margin: 16px; max-width: 480px; }
      label { display: block; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; }
      #saved { color: green; }
    </style>
  </head>
  <body>
    <h1>inkling options</h1>
    <p>Pairing connects the extension to the inkling app on this machine only.
    Find both values in inkling under Settings → Extension.</p>
    <label for="base-url">App address (from inkling Settings → Extension)</label>
    <input id="base-url" type="text" inputmode="url" autocomplete="off" placeholder="http://127.0.0.1:PORT" />
    <label for="token" style="margin-top: 8px;">Local token (stays on this machine)</label>
    <input id="token" type="password" autocomplete="off" />
    <p><button id="save" type="button">Save</button> <span id="saved" role="status"></span></p>
    <script src="options.js"></script>
  </body>
</html>
