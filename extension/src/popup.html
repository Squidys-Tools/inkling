<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font: 13px/1.5 system-ui, sans-serif;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      button {
        width: 100%;
        padding: 8px;
        font: inherit;
        border: 0;
        border-radius: 8px;
        background: #1a1a1a;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        margin: 12px 0 0;
        min-height: 20px;
        color: #555;
        overflow-wrap: anywhere;
      }
      .hint {
        margin: 8px 0 0;
        font-size: 12px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <h1>Save to inkling</h1>
    <button id="save" type="button">Save this page</button>
    <p id="status" role="status"></p>
    <p class="hint">Shortcut: Ctrl+Shift+S</p>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
