name: Links

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The benchmark corpus holds made-up URLs. A 403 or 429 is a site refusing bots, not a dead link.
      - uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --root-dir "$(pwd)" --no-progress --accept 200..=299,403,429
            --exclude-path benchmarks/corpus './**/*.md'
