name: Links

on:
  schedule:
    # Weekly on Mondays at 05:30 UTC (offset from the security scan at 03:30).
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    name: Check markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          format: markdown
          args: --root-dir "$(pwd)" --verbose --no-progress './**/*.md'
