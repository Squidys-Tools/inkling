name: Knip

on:
  schedule:
    - cron: "30 4 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Unused code cleanup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # This job holds a write token, so no dependency's install script may run.
      - run: bun install --frozen-lockfile --ignore-scripts
      # Without --allow-remove-files, Knip only strips unused exports and prunes dependencies.
      - run: bun run knip --fix
      - run: bun install --ignore-scripts
      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: chore/knip-cleanup
          delete-branch: true
          title: "chore: knip unused-code cleanup"
          body: |
            Automated `knip --fix` run (every other day). It strips unused exports and prunes unused dependencies, and never deletes files. If this PR is empty or noisy, tune the patterns in `knip.json`.
          commit-message: "root: strip unused exports and dependencies"
          labels: chore, automated
