name: Electron Preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "public/seed-demo/**"
      - "src/seedPersonal.ts"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: electron-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect preview changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      electron: ${{ steps.filter.outputs.electron }}
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Compare a synchronize event with the previous head, not the full
          # PR diff. This keeps a docs/demo-only follow-up from rebuilding.
          token: ''
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            electron:
              - 'electron/**'
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/electron-preview.yml'
              - 'scripts/prepare-electron-models.mjs'
              - 'scripts/packaged-backend-smoke.mjs'
              - 'scripts/linux-packaging.test.ts'
              - 'patches/**'

  build:
    name: Build Windows Electron installer
    needs: changes
    if: >-
      needs.changes.outputs.electron == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:win') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:win')
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cache pinned Electron models
        uses: actions/cache@v6
        with:
          path: .artifacts/electron-model-cache/models
          key: inkling-electron-models-win-${{ hashFiles('electron/model-manifest.json') }}
          restore-keys: inkling-electron-models-win-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build Electron NSIS installer
        run: bun run build:installer

      - name: Upload Electron installer
        id: installer
        uses: actions/upload-artifact@v7
        with:
          name: inkling-installer-win-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            .artifacts/electron/*.exe
            .artifacts/electron/*.blockmap
            .artifacts/electron/latest.yml
          if-no-files-found: error
          retention-days: 3

      - name: Comment artifact link
        uses: ./.github/actions/pr-comment
        with:
          marker: "<!-- inkling-electron-preview -->"
          # GitHub links a full commit SHA and shows its first seven characters.
          body: |-
            ### Inkling Electron preview

            [Download the Electron NSIS installer](${{ steps.installer.outputs.artifact-url }}) (for ${{ github.event.pull_request.head.sha }})

            [Build details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · Add the `preview:win` label to refresh it.
            The installer bundles the pinned embedding models. It is unsigned and may trigger a Windows SmartScreen warning.

  build-linux:
    name: Build and smoke-test Linux Electron directory
    needs: changes
    if: >-
      needs.changes.outputs.electron == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache pinned embedding models
        uses: actions/cache@v6
        with:
          path: .artifacts/electron-model-cache/models
          key: inkling-electron-models-linux-${{ hashFiles('electron/model-manifest.json') }}
          restore-keys: inkling-electron-models-linux-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check the updater and packaging logic
        run: bun test electron/updater.test.ts

      - name: Build Electron directory
        run: bun run build:dir

      - name: Check packaged Linux OCR, PDF and native models
        run: bun scripts/packaged-backend-smoke.mjs

      - name: Install X11 window probe
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xdotool

      - name: Launch the packaged app under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/.artifacts/electron/linux-unpacked/inkling"
          data_dir="$(mktemp -d)"
          log_file="$RUNNER_TEMP/inkling-electron-smoke.log"
          xvfb-run -a bash -c '
            set -euo pipefail
            app="$1"
            data_dir="$2"
            log_file="$3"
            "$app" --no-sandbox --disable-gpu --user-data-dir "$data_dir" >"$log_file" 2>&1 &
            app_pid=$!
            cleanup() {
              if kill -0 "$app_pid" 2>/dev/null; then
                kill -TERM "$app_pid"
                wait "$app_pid" || true
              fi
              rm -rf "$data_dir"
            }
            trap cleanup EXIT
            for attempt in $(seq 1 60); do
              window_id="$(xdotool search --onlyvisible --name "^inkling$" 2>/dev/null | head -n 1 || true)"
              if [ -n "$window_id" ]; then
                echo "Packaged Electron window opened under Xvfb."
                exit 0
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then
                cat "$log_file"
                exit 1
              fi
              sleep 0.5
            done
            cat "$log_file"
            exit 1
          ' _ "$app" "$data_dir" "$log_file"

      - name: Upload Linux Electron directory
        uses: actions/upload-artifact@v7
        with:
          name: inkling-electron-dir-linux-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .artifacts/electron/linux-unpacked
          if-no-files-found: error
          retention-days: 3

  build-mac:
    name: Build and smoke-test macOS Electron app
    needs: changes
    if: >-
      needs.changes.outputs.electron == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache pinned embedding models
        uses: actions/cache@v6
        with:
          path: .artifacts/electron-model-cache/models
          key: inkling-electron-models-mac-${{ hashFiles('electron/model-manifest.json') }}
          restore-keys: inkling-electron-models-mac-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build Electron app bundle
        run: bun run build:dir

      # electron-builder skips signing PR builds. Seal only this preview with
      # the literal ad-hoc identity: no certificate, keychain or notarization.
      - name: Ad-hoc sign the PR preview
        shell: bash
        run: |
          set -euo pipefail
          app=".artifacts/electron/mac-arm64/inkling.app"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -Fx 'Signature=adhoc'

      # An arm64 bundle whose signature broke during packaging will not launch: macOS calls it damaged.
      - name: Check the ad-hoc signature
        run: codesign --verify --deep --strict .artifacts/electron/mac-arm64/inkling.app

      - name: Check packaged OCR, PDF and native models
        run: bun scripts/packaged-backend-smoke.mjs

      - name: Launch the packaged app
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          log_file="$RUNNER_TEMP/inkling-electron-smoke.log"
          .artifacts/electron/mac-arm64/inkling.app/Contents/MacOS/inkling \
            --user-data-dir="$data_dir" --remote-debugging-port=9230 >"$log_file" 2>&1 &
          app_pid=$!
          trap 'kill -TERM "$app_pid" 2>/dev/null || true; wait "$app_pid" || true; rm -rf "$data_dir"' EXIT
          for attempt in $(seq 1 60); do
            if curl -fs http://127.0.0.1:9230/json/list | grep -q 'app://local/index.html'; then
              echo "Packaged Electron window loaded the app."
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 0.5
          done
          cat "$log_file"
          exit 1
