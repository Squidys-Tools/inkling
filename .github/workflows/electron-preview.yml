name: Electron Preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "public/seed-demo/**"
      - "src/seedPersonal.ts"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: electron-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect preview changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      electron: ${{ steps.filter.outputs.electron }}
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Compare a synchronize event with the previous head, not the full
          # PR diff. This keeps a docs/demo-only follow-up from rebuilding.
          token: ''
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            electron:
              - 'electron/**'
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/electron-preview.yml'
              - 'scripts/prepare-electron-models.mjs'
              - 'electron/model-manifest.json'

  build:
    name: Build Windows Electron installer
    needs: changes
    if: >-
      needs.changes.outputs.electron == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:win') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:win')
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cache pinned Electron models
        uses: actions/cache@v4
        with:
          path: .artifacts/electron-model-cache/models
          key: inkling-electron-models-win-${{ hashFiles('electron/model-manifest.json') }}
          restore-keys: inkling-electron-models-win-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build Electron NSIS installer
        run: bun run electron:build:nsis

      - name: Upload Electron installer
        id: installer
        uses: actions/upload-artifact@v7
        with:
          name: inkling-installer-win-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            .artifacts/electron/*.exe
            .artifacts/electron/*.blockmap
            .artifacts/electron/latest.yml
          if-no-files-found: error
          retention-days: 3

      - name: Comment artifact link
        uses: actions/github-script@v9
        env:
          INSTALLER_URL: ${{ steps.installer.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = "<!-- inkling-electron-preview -->";
            const body = [
              marker,
              "### Inkling Electron preview",
              "",
              `[Download the Electron NSIS installer](${process.env.INSTALLER_URL})` +
                ` (for \`${process.env.HEAD_SHA.slice(0, 7)}\`)`,
              "",
              `[Build details](${process.env.RUN_URL}) · Add the \`preview:win\` label to refresh it.`,
              "The installer bundles the pinned embedding models. It is unsigned and may trigger a Windows SmartScreen warning.",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  build-linux:
    name: Build and smoke-test Linux Electron directory
    needs: changes
    if: >-
      needs.changes.outputs.electron == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache pinned embedding models
        uses: actions/cache@v4
        with:
          path: .artifacts/electron-model-cache/models
          key: inkling-electron-models-linux-${{ hashFiles('electron/model-manifest.json') }}
          restore-keys: inkling-electron-models-linux-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check the updater and packaging logic
        run: bun test electron/updater.test.ts

      - name: Build Electron directory
        run: bun run electron:build:dir

      - name: Install X11 window probe
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xdotool

      - name: Launch the packaged app under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/.artifacts/electron/linux-unpacked/inkling"
          data_dir="$(mktemp -d)"
          log_file="$RUNNER_TEMP/inkling-electron-smoke.log"
          xvfb-run -a bash -c '
            set -euo pipefail
            app="$1"
            data_dir="$2"
            log_file="$3"
            "$app" --no-sandbox --disable-gpu --user-data-dir "$data_dir" >"$log_file" 2>&1 &
            app_pid=$!
            cleanup() {
              if kill -0 "$app_pid" 2>/dev/null; then
                kill -TERM "$app_pid"
                wait "$app_pid" || true
              fi
              rm -rf "$data_dir"
            }
            trap cleanup EXIT
            for attempt in $(seq 1 60); do
              window_id="$(xdotool search --onlyvisible --name "^inkling$" 2>/dev/null | head -n 1 || true)"
              if [ -n "$window_id" ]; then
                echo "Packaged Electron window opened under Xvfb."
                exit 0
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then
                cat "$log_file"
                exit 1
              fi
              sleep 0.5
            done
            cat "$log_file"
            exit 1
          ' _ "$app" "$data_dir" "$log_file"

      - name: Upload Linux Electron directory
        uses: actions/upload-artifact@v7
        with:
          name: inkling-electron-dir-linux-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .artifacts/electron/linux-unpacked
          if-no-files-found: error
          retention-days: 3
