name: Deploy site

# The only way the marketing site reaches production. Every push to main that can change the
# built site deploys it, and Release dispatches it after each nightly publishes. Run it by hand
# after publishing a stable release: the build looks up the latest release's installers.
on:
  push:
    branches: [main]
    # Keep in sync with the `site` filter in site-preview.yml.
    paths:
      - 'apps/site/**'
      - 'apps/renderer/**'
      - 'packages/contracts/**'
      - 'packages/ingestion/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'tsconfig.base.json'
      - '.bun-version'
      - 'patches/**'
      - 'tools/ci/**'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# A running deploy finishes; a newer push replaces any deploy still waiting, so the last push to
# main is the one that ends up live.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: site-production
      url: https://getinkling.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun tools/ci/site-deploy.ts production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
