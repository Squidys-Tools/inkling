name: Security

on:
  push:
    branches:
      - main
    paths-ignore:
      # Docs / design assets carry no executable code — skip security checks
      # entirely when a push only touches these (mixed code+docs still runs).
      # Automation config (.entire/) is deliberately NOT ignored: runner
      # prompts execute in automation, so those changes must be scanned.
      # The weekly schedule always runs regardless of paths.
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "pen/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "pen/**"
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    # Push-to-main gate only. PRs and scheduled scans always run the full
    # matrix, so no filter outputs are needed for those events.
    if: github.event_name == 'push'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so the path filter diffs the real change set.
          # A shallow checkout can yield an empty diff and silently skip jobs.
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        # Pinned to the v3 tag commit: this job gates security checks, so a
        # hijacked floating tag must not be able to falsify filter outputs.
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'benchmarks/**'
              - 'index.html'
              - 'package.json'
              - 'bun.lock'
              - '.bun-version'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - '.github/workflows/security.yml'
            native:
              - 'src-tauri/**'
              - '.github/workflows/security.yml'

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    # Pull requests are the untrusted boundary (forks), so they always run
    # the full matrix. Path gating applies to push-to-main only, where the
    # PR already passed full scans. needs.* is 'skipped' on schedule, so
    # check the event first (skipped outputs read as empty, not 'true').
    if: >-
      github.event_name != 'push' ||
      needs.changes.result == 'skipped' ||
      (matrix.language == 'javascript-typescript' && needs.changes.outputs.frontend == 'true') ||
      (matrix.language == 'rust' && needs.changes.outputs.native == 'true')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    # Runs on every PR with no path gate: dependency changes are exactly what
    # this job exists to catch, and a filter failure must never skip it.
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
