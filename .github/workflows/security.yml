name: Security

on:
  push:
    branches:
      - main
    paths-ignore:
      # Docs carry no executable code — skip security checks
      # entirely when a push only touches these (mixed code+docs still runs).
      # Automation config (.entire/) is deliberately NOT ignored: runner
      # prompts execute in automation, so those changes must be scanned.
      # The weekly schedule always runs regardless of paths.
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    # Detect the files introduced by the current push. For PR synchronize
    # events, comparing against the previous head prevents a docs-only follow-
    # up commit from rerunning the full security matrix.
    if: always() && !cancelled()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      native: ${{ steps.filter.outputs.native }}
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history so the path filter diffs the real change set.
          # A shallow checkout can yield an empty diff and silently skip jobs.
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        # Pinned to the v4 tag commit: this job gates security checks, so a
        # hijacked floating tag must not be able to falsify filter outputs.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # An empty token makes paths-filter use the checked-out commit range,
          # so PR synchronize events can inspect only the newest push.
          token: ''
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            relevant:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!AGENTS.md'
              - '!public/seed-demo/**'
              - '!src/seedPersonal.ts'
            frontend:
              - 'src/**'
              - 'public/**'
              - '!src/seedPersonal.ts'
              - '!public/seed-demo/**'
              - 'benchmarks/**'
              - 'index.html'
              - 'package.json'
              - 'bun.lock'
              - '.bun-version'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - '.github/workflows/security.yml'
            native:
              - 'src-tauri/**'
              - '.github/workflows/security.yml'

  gate:
    name: PR scan gate
    # Decides whether this PR event gets a full CodeQL matrix run: always on
    # open/reopen, otherwise roughly every 4th push (by total commit count).
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scan: ${{ steps.decide.outputs.scan }}
    steps:
      - name: Decide whether to run the full matrix
        id: decide
        # Pinned to the v9 tag commit, like the path filter above.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.payload.action === 'opened' || context.payload.action === 'reopened') {
              core.setOutput('scan', 'true');
              core.info('PR opened/reopened: running full scan.');
              return;
            }
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const scan = commits.length % 4 === 1 ? 'true' : 'false';
            core.setOutput('scan', scan);
            core.info(`PR has ${commits.length} commits; full scan=${scan}.`);

  codeql-javascript:
    name: CodeQL (javascript-typescript)
    needs: [changes, gate]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' ||
       (needs.gate.outputs.scan == 'true' && needs.changes.outputs.frontend == 'true') ||
       (github.event_name == 'push' && needs.changes.outputs.frontend == 'true'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  codeql-rust:
    name: CodeQL (rust)
    needs: [changes, gate]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' ||
       (needs.gate.outputs.scan == 'true' && needs.changes.outputs.native == 'true') ||
       (github.event_name == 'push' && needs.changes.outputs.native == 'true'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust

  dependency-review:
    name: Dependency review
    # Dependency review is unnecessary for documentation and demo-data-only
    # pushes, but remains required for every PR push that changes real files.
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.relevant == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
