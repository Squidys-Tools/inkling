name: Next

# The rebuilt app in next/. It has its own workspace, lockfile and checks.
on:
  push:
    branches:
      - main
    paths:
      - "next/**"
      - ".github/workflows/next.yml"
  pull_request:
    paths:
      - "next/**"
      - ".github/workflows/next.yml"

permissions:
  contents: read

concurrency:
  group: next-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: next

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: next/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  launch:
    name: Build and launch on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: next/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build:app
      - name: Launch and reach the library process
        if: runner.os == 'Linux'
        run: xvfb-run -a bun tools/smoke/launch.ts
      - name: Launch and reach the library process
        if: runner.os != 'Linux'
        run: bun tools/smoke/launch.ts
