name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly CodeQL scan of main, for queries that changed while the code did not.
    - cron: "30 3 * * 1"

permissions:
  contents: read

# A newer push replaces a PR's run. Runs on main all finish, so each merge gets its own result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
      app: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
      macos: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.macos == 'true' }}
    steps:
      # A shallow checkout can yield an empty diff for a push and silently skip every job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          filter: blob:none
      # A PR compares its whole diff with its base, through the API; a push compares with the previous head.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code: &code
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              - 'extension/**'
              - 'benchmarks/**'
              - 'patches/**'
              - 'build/**'
              - '*.json'
              - '*.jsonc'
              - 'bun.lock'
              - '.bun-version'
              - 'bunfig.toml'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/checks.yml'
              - '.github/workflows/package.yml'
            app:
              - *code
              - '!apps/site/**'
              - '!apps/renderer/src/library/preview/seed-demo/**'
              - '!apps/renderer/src/library/preview/seed.ts'
              - '!apps/renderer/src/library/preview/seed-data.ts'
              - '!benchmarks/**'
              - '!extension/**'
            # What can break the macOS package without breaking Windows or Linux.
            macos:
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'build/**'
              - 'apps/desktop/**'
              - 'packages/jobs/**'
              - 'tools/models/**'
              - 'tools/repo/dist.ts'
              - 'tools/smoke/**'
              - '.github/workflows/package.yml'

  checks:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/checks.yml

  # macOS packages on a PR that changes its inputs and in every nightly, never on a push to main:
  # with a dozen merges an hour its runner queue backs up until GitHub cancels jobs.
  package:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/package.yml
    with:
      macos: ${{ github.event_name != 'push' && needs.changes.outputs.macos == 'true' }}

  codeql:
    name: CodeQL
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # The one check to require: it fails when any job above failed or was cancelled, and passes
  # when the jobs a change does not need were skipped. A run a newer push replaced reports nothing.
  result:
    name: CI result
    needs: [changes, checks, package, codeql, dependency-review]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
