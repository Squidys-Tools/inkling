name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly CodeQL scan of main, for queries that changed while the code did not.
    - cron: "30 3 * * 1"

permissions:
  contents: read

# A newer push replaces a PR's run. Every other run gets a group of its own: a shared group keeps
# only one pending run and cancels the rest, which left merges to main with no result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Only a PR skips what its diff cannot break. Every commit on main runs the checks and packages,
    # so main's newest result always covers main, even after a docs-only merge.
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
      macos: ${{ github.event_name != 'pull_request' || steps.filter.outputs.macos == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code: &code
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              - 'extension/**'
              - 'benchmarks/**'
              - 'patches/**'
              - 'build/**'
              - '*.json'
              - '*.jsonc'
              - 'bun.lock'
              - '.bun-version'
              - 'bunfig.toml'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/checks.yml'
              - '.github/workflows/package.yml'
            app:
              - *code
              - '!apps/site/**'
              - '!apps/renderer/src/library/preview/seed-demo/**'
              - '!apps/renderer/src/library/preview/seed.ts'
              - '!apps/renderer/src/library/preview/seed-data.ts'
              - '!benchmarks/**'
              - '!extension/**'
            # What can break the macOS package without breaking Windows or Linux.
            macos:
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'build/**'
              - 'apps/desktop/**'
              - 'packages/jobs/**'
              - 'tools/models/**'
              - 'tools/repo/dist.ts'
              - 'tools/smoke/**'
              - '.github/workflows/package.yml'

  checks:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/checks.yml

  # macOS packages on a PR that changes its inputs and in every nightly, never on a push to main:
  # with a dozen merges an hour its runner queue backs up until GitHub cancels jobs.
  package:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/package.yml
    with:
      macos: ${{ github.event_name != 'push' && needs.changes.outputs.macos == 'true' }}

  codeql:
    name: CodeQL
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # glib reaches apps/setup/Cargo.lock only through tao/wry's Linux GTK backend; the
          # setup window builds for Windows alone, so that code is never compiled.
          allow-ghsas: GHSA-wrw7-89jp-8q8g

  # The one check to require: it fails when any job above failed or was cancelled, and passes
  # when the jobs a change does not need were skipped. A run a newer push replaced reports nothing.
  result:
    name: CI result
    needs: [changes, checks, package, codeql, dependency-review]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
