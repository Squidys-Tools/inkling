name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history so the path filter diffs the real change set.
          # A shallow checkout can yield an empty diff and silently skip jobs.
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        # Pinned to the v4 tag commit: this job gates security checks, so a
        # hijacked floating tag must not be able to falsify filter outputs.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # For PR synchronize events, compare only the newest push with the
          # previous head. The default PR diff compares the whole PR to main,
          # which makes a docs-only follow-up rerun code checks.
          token: ''
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'apps/**'
              - '!apps/renderer/src/library/preview/seed-demo/**'
              - '!apps/renderer/src/library/preview/seed.ts'
              - 'packages/**'
              - 'tools/**'
              - 'extension/**'
              - 'benchmarks/**'
              - 'patches/**'
              - 'build/**'
              - '*.json'
              - '*.jsonc'
              - 'bun.lock'
              - '.bun-version'
              - 'bunfig.toml'
              - 'tsconfig.base.json'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.github/workflows/ci.yml'

  check:
    name: Typecheck, lint, test and build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Windows is inkling's main target, so the suite runs there.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # pwsh only fails a multi-line step on its last command; bash stops at the first failure.
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck every workspace
        run: bun run typecheck

      - name: Check documented commands exist
        run: bun run check:refs

      - name: Run unit tests
        run: bun run test

      - name: Check for unused code
        run: bun run knip

      - name: Lint and format
        run: bun run lint

      # Its guard fails if the web preview's demo seed reaches a shipped bundle.
      - name: Build the app
        run: bun run build:app

      - name: Build the web preview
        run: bun run build:web

      - name: Run ingestion smoke tests
        run: bun run ingest:smoke

      - name: Build browser extension
        run: bun run --cwd extension build

  launch:
    name: Build and launch on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build:app
      - name: Launch and reach the library process
        if: runner.os == 'Linux'
        run: xvfb-run -a bun tools/smoke/launch.ts
      - name: Launch and reach the library process
        if: runner.os != 'Linux'
        run: bun tools/smoke/launch.ts
