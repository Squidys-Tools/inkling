name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      # Docs carry no executable code — skip CI entirely
      # when a push only touches these (mixed code+docs pushes still run).
      # Automation config (.entire/) is deliberately NOT ignored: runner
      # prompts execute in automation, so those changes must run checks.
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history so the path filter diffs the real change set.
          # A shallow checkout can yield an empty diff and silently skip jobs.
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        # Pinned to the v4 tag commit: this job gates security checks, so a
        # hijacked floating tag must not be able to falsify filter outputs.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # For PR synchronize events, compare only the newest push with the
          # previous head. The default PR diff compares the whole PR to main,
          # which makes a docs-only follow-up rerun code checks.
          token: ''
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - '!src/seedPersonal.ts'
              - '!public/seed-demo/**'
              - 'benchmarks/**'
              - 'index.html'
              - 'package.json'
              - 'bun.lock'
              - '.bun-version'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - '.github/workflows/ci.yml'
            native:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

      - name: Check for unused code
        run: bun run knip:check

      - name: Build frontend
        run: bun run build

      - name: Run ingestion smoke tests
        run: bun run ingest:smoke

  native:
    name: Native checks
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust application
        working-directory: src-tauri
        run: cargo check --locked

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked -- --nocapture
