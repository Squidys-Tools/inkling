name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      # Docs / design assets carry no executable code — skip CI entirely
      # when a push only touches these (mixed code+docs pushes still run).
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "pen/**"
      - ".entire/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "pen/**"
      - ".entire/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'benchmarks/**'
              - 'index.html'
              - 'package.json'
              - 'bun.lock'
              - '.bun-version'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - '.github/workflows/ci.yml'
            native:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Run ingestion smoke tests
        run: bun run ingest:smoke

  native:
    name: Native checks
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust application
        working-directory: src-tauri
        run: cargo check --locked

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked -- --nocapture
