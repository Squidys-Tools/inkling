name: Checks

# The typecheck, lint, build and unit-test gates. CI runs them on every code change and Release
# on the commit it ships, so both always run the same gates.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  static:
    name: Typecheck, lint and web builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun tools/repo/command-refs.ts
      - run: bun run knip
      - run: bun run lint
      - run: bun run build:web
      - run: bun run --cwd extension build

  test:
    name: Unit tests
    # Windows is inkling's main target, so the suite runs there.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test
