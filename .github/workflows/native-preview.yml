name: Windows Preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: native-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build portable Windows preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:win') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:win')
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build portable preview
        run: bun run preview:win

      - name: Upload portable preview
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkling-preview-win-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .artifacts/inkling-preview-win
          if-no-files-found: error
          retention-days: 3

      - name: Comment artifact link
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = "<!-- inkling-native-preview -->";
            const body = [
              marker,
              "### Inkling Windows preview",
              "",
              `[Download the portable folder](${process.env.ARTIFACT_URL})` +
                ` (for \`${process.env.HEAD_SHA.slice(0, 7)}\`)`,
              "",
              `[Build details](${process.env.RUN_URL}) · Add the \`preview:win\` label to refresh it.`,
              "The folder includes the pinned embedding models and stores review data under its own `data\\` directory.",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
