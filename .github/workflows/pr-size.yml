name: PR size

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  label:
    name: Label PR size
    # An edit changes the diff only when it moves the base.
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pr-size-${{ github.event.pull_request.number }}
      # A cancel between removing the old label and adding the new one leaves no size label.
      cancel-in-progress: false
    steps:
      # pull_request_target checks out the base branch. Never check out or run the PR's code here:
      # this job holds a write token. The script reads the diff from the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun tools/ci/pr-size.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
