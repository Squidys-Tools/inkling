name: Release

on:
  push:
    tags: ["v*.*.*", "!v*-nightly.*", "!v*-preview.*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release train (preview builds only, never releases)
        type: choice
        options: [preview, stable, nightly]
        default: preview
      version:
        description: Stable version override; defaults to the version the latest nightly previewed
        type: string
  schedule:
    - cron: "23 6 * * *"

# t3code-style serialization: nightlies (scheduled, dispatched nightly and
# preview builds) share one group, stable gets its own so a nightly never
# blocks it. Running publishers are never canceled and queue: max keeps every
# pending run instead of the default newest-wins slot, so a queued stable tag
# cannot be dropped. Scheduled runs recheck whether a nightly is due after
# leaving the queue.
concurrency:
  group: >-
    inkling-release-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly' || inputs.channel == 'preview') && 'nightly' || 'stable' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  # Picks the commit every later job builds. Nightlies and tag pushes build the
  # triggering commit. A manual stable release builds the latest published
  # nightly's commit, so stable only ever ships a build nightly users have
  # already run. Scheduled runs also decide here whether a nightly is due.
  resolve:
    name: Resolve release commit
    if: github.repository == 'Squidys-Tools/inkling'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      channel: ${{ steps.resolve.outputs.channel }}
      due: ${{ steps.resolve.outputs.due }}
      nightly_version: ${{ steps.resolve.outputs.nightly_version }}
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Resolve release commit
        id: resolve
        # Pinned to the v9 tag commit, like the other gate jobs.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        with:
          script: |
            const {
              assertCommitOnDefaultBranch,
              assertReleaseSource,
              shouldReleaseNightly,
              resolveLatestNightlyCommit,
            } = require("./.github/scripts/nightly-release.cjs");

            const channel =
              context.eventName === "schedule"
                ? "nightly"
                : context.eventName === "workflow_dispatch"
                  ? process.env.DISPATCH_CHANNEL || "preview"
                  : "stable";
            core.setOutput("channel", channel);
            await assertReleaseSource({ github, context, releaseChannel: channel });

            if (context.eventName === "schedule") {
              core.setOutput("due", await shouldReleaseNightly({ github, context, core }));
              core.setOutput("ref", context.sha);
            } else if (context.eventName === "workflow_dispatch" && channel === "stable") {
              const { tag, sha, version } = await resolveLatestNightlyCommit({ github, context, core });
              await assertCommitOnDefaultBranch({ github, context, sha });
              core.notice(`Stable release builds ${sha}, the commit shipped by ${tag}.`);
              core.setOutput("ref", sha);
              core.setOutput("nightly_version", version);
            } else {
              core.setOutput("ref", context.sha);
            }

  metadata:
    name: Resolve release metadata
    needs: resolve
    if: needs.resolve.result == 'success' && needs.resolve.outputs.due != 'false'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      channel: ${{ needs.resolve.outputs.channel }}
      ref: ${{ needs.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: version
        env:
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_VERSION: ${{ inputs.version || needs.resolve.outputs.nightly_version || github.ref_name }}
        run: bun tools/release/prepare.mjs

  build:
    needs: [resolve, metadata]
    if: needs.metadata.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win
            name: windows
          - os: ubuntu-latest
            target: linux
            name: linux
          # onnxruntime-node ships no macOS x64 binary, so Intel Macs get no build.
          - os: macos-15
            target: mac
            name: mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v6
        with:
          path: .artifacts/electron-model-cache/models
          key: inkling-models-${{ hashFiles('packages/jobs/src/model-manifest.json') }}
      - name: Stage exact release metadata
        env:
          RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: bun tools/release/prepare.mjs
      - name: Build reviewed platform artifacts (never publish from builder)
        env:
          DIST_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          umask 022
          bun run dist "$DIST_TARGET"
      # electron-builder still writes update-info yml for a preview build; it
      # must never reach a release, where a channel feed could point at it.
      - name: Strip preview update feeds
        if: needs.metadata.outputs.channel == 'preview'
        shell: bash
        run: rm -f .artifacts/electron/*.yml
      # The .deb depends on FFmpeg for local-video posters; the runner image has none.
      - name: Install the video decoder the Linux package depends on
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Exercise actual packaged Linux processing and local update feeds
        if: runner.os == 'Linux'
        run: |
          bun tools/smoke/packaged-backend.mjs
          bun tools/smoke/update-feed.mjs .artifacts/electron/linux-unpacked
          python3 -I -B apps/desktop/src/updates/update-helper.test.py
          bun tools/smoke/media.mjs .artifacts/electron/linux-unpacked .artifacts/media-smoke
          xvfb-run -a bun tools/smoke/launch.ts .artifacts/electron/linux-unpacked/inkling
      - name: Exercise packaged macOS processing and its ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict .artifacts/electron/mac-arm64/inkling.app
          bun tools/smoke/packaged-backend.mjs
          bun tools/smoke/launch.ts .artifacts/electron/mac-arm64/inkling.app/Contents/MacOS/inkling
      - name: Exercise packaged Windows processing
        if: runner.os == 'Windows'
        run: |
          bun tools/smoke/packaged-backend.mjs
          bun tools/smoke/launch.ts .artifacts/electron/win-unpacked/inkling.exe
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            .artifacts/electron/*.exe
            .artifacts/electron/*.deb
            .artifacts/electron/*.AppImage
            .artifacts/electron/*.dmg
            .artifacts/electron/*.blockmap
            .artifacts/electron/latest*.yml
            .artifacts/electron/nightly*.yml
            !.artifacts/electron/*-mac.yml
          if-no-files-found: error

  publish:
    name: Create the GitHub release
    needs: [resolve, metadata, build]
    # A preview-channel run only builds and checks the artifacts; it releases nothing.
    if: >-
      needs.resolve.result == 'success' &&
      needs.metadata.result == 'success' &&
      needs.build.result == 'success' &&
      needs.resolve.outputs.channel != 'preview' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      # The release starts as a draft so a channel's feed only goes live once
      # every asset is attached; nightlies publish right after, stable stays a
      # draft a maintainer reviews.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.ref }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--draft --target "$RELEASE_COMMIT" --title "inkling $RELEASE_TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" "${args[@]}" release-assets/*
      - name: Publish the nightly once its assets are attached
        if: needs.metadata.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
