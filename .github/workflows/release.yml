name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = @"
          Download the unsigned Windows Electron installer from the release assets below. Windows SmartScreen may warn that the publisher is unknown because the installer does not use a paid code-signing certificate. Only run an installer downloaded from this official release.

          The app checks GitHub for updates once when it opens. No library data is sent, and updates install only after you choose Update available in the sidebar.
          "@
          & gh release create $env:RELEASE_TAG --verify-tag --draft --title "inkling $env:RELEASE_TAG" --generate-notes --notes $notes
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create the draft Electron release."
          }

      - name: Cache pinned Electron models
        uses: actions/cache@v6
        with:
          path: .artifacts/electron-model-cache/models
          key: inkling-electron-release-models-${{ hashFiles('electron/model-manifest.json') }}

      - name: Build Electron NSIS installer
        run: bun run build:installer

      - name: Upload Electron updater assets to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem .artifacts/electron -File |
            Where-Object { $_.Name -eq "latest.yml" -or $_.Extension -in @(".exe", ".blockmap") } |
            ForEach-Object { $_.FullName })
          if (-not ($assets | Where-Object { [IO.Path]::GetFileName($_) -eq "latest.yml" })) {
            throw "electron-builder did not create latest.yml."
          }
          if (-not ($assets | Where-Object { [IO.Path]::GetExtension($_) -eq ".exe" })) {
            throw "electron-builder did not create a Windows installer."
          }
          $arguments = @("release", "upload", $env:RELEASE_TAG) + $assets + @("--clobber")
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload Electron updater assets to the draft release."
          }
