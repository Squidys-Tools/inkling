name: Release

on:
  push:
    tags: ["v*.*.*", "!v*-nightly.*", "!v*-preview.*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release train (preview builds only, never releases)
        type: choice
        options: [preview, stable, nightly]
        default: preview
      version:
        description: Stable version override; defaults to the version the latest nightly previewed
        type: string
  schedule:
    # Every 30 minutes; tools/release/resolve.ts ships at most one nightly per 8-hour slot, so a
    # late or dropped tick is caught by the next one in the same slot.
    - cron: "8,38 * * * *"

# Nightly and preview runs share one group and stable gets its own, so a nightly never blocks a
# stable. Publishers are never canceled, and `queue: max` keeps every pending run instead of only
# the newest, so a queued stable tag cannot be dropped.
concurrency:
  group: >-
    inkling-release-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly' || inputs.channel == 'preview') && 'nightly' || 'stable' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release
    if: github.repository == 'Squidys-Tools/inkling'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.resolve.outputs.due }}
      channel: ${{ steps.resolve.outputs.channel }}
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        run: bun tools/release/resolve.ts
      - if: steps.resolve.outputs.due == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.ref }}
      - if: steps.resolve.outputs.due == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - id: version
        if: steps.resolve.outputs.due == 'true'
        env:
          RELEASE_CHANNEL: ${{ steps.resolve.outputs.channel }}
          RELEASE_VERSION: ${{ inputs.version || steps.resolve.outputs.nightly_version || github.ref_name }}
        run: bun tools/release/prepare.mjs

  checks:
    needs: resolve
    if: needs.resolve.outputs.due == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  package:
    needs: resolve
    if: needs.resolve.outputs.due == 'true'
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      channel: ${{ needs.resolve.outputs.channel }}
      version: ${{ needs.resolve.outputs.version }}

  publish:
    name: Create the GitHub release
    needs: [resolve, checks, package]
    if: >-
      needs.resolve.outputs.channel != 'preview' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.ref }}
    steps:
      # Check out before downloading: a checkout cleans the workspace, which would delete the installers.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      # Made with the workflow token, which GitHub does not let start the tag-push trigger. A
      # personal or app token here would start a second run.
      - run: bun tools/release/tag.ts
      # The release starts as a draft so a channel's feed goes live only once every asset is
      # attached. A nightly publishes right after; a stable stays a draft a maintainer reviews.
      - name: Create the release as a draft
        env:
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          args=(--draft --target "$RELEASE_COMMIT" --title "inkling $RELEASE_TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" "${args[@]}" release-assets/*
      - name: Publish the nightly
        if: needs.resolve.outputs.channel == 'nightly'
        run: gh release edit "$RELEASE_TAG" --draft=false
      # Publishes made with the workflow token emit no release event, so the site deploy that
      # picks up the new installers is dispatched directly.
      - name: Deploy the site for the published nightly
        if: needs.resolve.outputs.channel == 'nightly'
        run: gh workflow run site-deploy.yml --ref main
