name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # tauri.conf.json bundles onnxruntime.dll, and tauri-build validates
      # bundle resources on every build, so the pinned DLL has to be in place
      # before tauri-action runs. `ort` is load-dynamic: skip this and the
      # installer ships with dead embeddings and OCR.
      - name: Provision ONNX Runtime
        run: bun run provision:ort

      - name: Verify updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY must be configured to build signed updater artifacts."
          }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($config.plugins.updater.pubkey)) {
            throw "Set the Tauri updater public key in src-tauri/tauri.conf.json before releasing."
          }
          if ($config.plugins.updater.requireSignedVersion -ne $true) {
            throw "Updater signatures must be bound to their release version."
          }
          $payload = Join-Path $env:RUNNER_TEMP "inkling-updater-signing-check.bin"
          [IO.File]::WriteAllBytes($payload, [byte[]](0x49, 0x4e, 0x4b, 0x4c))
          bun tauri signer sign --app-version "0.0.0" $payload
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$payload.sig")) {
            throw "Could not sign the updater configuration check payload."
          }
          $env:INKLING_UPDATER_PUBLIC_KEY = $config.plugins.updater.pubkey
          $env:INKLING_SIGNING_TEST_PAYLOAD = $payload
          $env:INKLING_SIGNING_TEST_SIGNATURE = "$payload.sig"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test updater_signing release_signing_key_matches_configured_updater_public_key -- --ignored --exact
          if ($LASTEXITCODE -ne 0) {
            throw "The configured updater public key does not match the release signing key."
          }

      - name: Build Tauri application and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: inkling ${{ github.ref_name }}
          releaseBody: |
            Download the unsigned Windows installer from the release assets below. Windows SmartScreen may warn that the publisher is unknown; this is expected because inkling does not use a paid code-signing certificate. Only run an installer downloaded from this official release.

            inkling checks GitHub for updates once when it opens. No library data is sent, and updates install only after you choose Update available in the sidebar.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          tauriScript: bun tauri
