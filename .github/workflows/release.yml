name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: blacksmith-4vcpu-windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # tauri.conf.json bundles onnxruntime.dll, and tauri-build validates
      # bundle resources on every build, so the pinned DLL has to be in place
      # before tauri-action runs. `ort` is load-dynamic: skip this and the
      # installer ships with dead embeddings and OCR.
      - name: Provision ONNX Runtime
        run: bun run provision:ort

      - name: Build Tauri application and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: inkling ${{ github.ref_name }}
          releaseBody: Download the Windows installer from the release assets below.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          tauriScript: bun tauri
