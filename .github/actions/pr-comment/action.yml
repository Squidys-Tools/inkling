name: Update PR comment
description: Creates the pull request comment that starts with a marker, or updates it when one exists.

inputs:
  marker:
    description: Hidden HTML comment that tells this comment apart from the PR's others.
    required: true
  body:
    description: Markdown shown below the marker.
    required: true

runs:
  using: composite
  steps:
    - name: Create or update the comment
      uses: actions/github-script@v9
      env:
        MARKER: ${{ inputs.marker }}
        BODY: ${{ inputs.body }}
      with:
        script: |
          const marker = process.env.MARKER;
          const body = `${marker}\n${process.env.BODY}`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            per_page: 100,
          });

          const existing = comments.find((comment) => comment.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
          }
